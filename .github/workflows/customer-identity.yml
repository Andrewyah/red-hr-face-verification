name: Customer identity evaluation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol-and-staff-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-test.lock
      - run: python scripts/fetch_models.py
      - run: python scripts/check_customer_scope.py
      - run: python -m pytest -q
      - run: npm install --prefix /tmp/customer-ui-test --no-audit --no-fund jsdom@30.1.3
      - run: JSDOM_MODULE=/tmp/customer-ui-test/node_modules/jsdom node --test tests/customer-capture.test.cjs
      - name: Build the exact shared runtime image
        run: docker build -t red-face-customer-evaluation .
